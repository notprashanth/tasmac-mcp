[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tasmac-mcp"
version = "1.0.1"
description = "Live liquor stock, prices and shop locations for Tamil Nadu (TASMAC), as a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prashanth Krishnan" }]
keywords = ["mcp", "tasmac", "tamil-nadu", "open-data", "cli", "india"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# The core is standard library only, so running the CLI from a checkout needs
# nothing installed. But anyone installing a package called tasmac-mcp expects
# the server to work, and `uvx tasmac-mcp` has to run without extras, so mcp is
# a hard dependency here.
# Upper bound is deliberate. mcp 2.0 removed mcp.server.fastmcp in favour of
# MCPServer, so the server module does not import there. Without this pin a
# fresh install resolves to 2.x and fails at startup.
dependencies = ["mcp>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/notprashanth/tasmac-mcp"
Repository = "https://github.com/notprashanth/tasmac-mcp"
Issues = "https://github.com/notprashanth/tasmac-mcp/issues"

[project.scripts]
tasmac = "tasmac_mcp.core:main"
tasmac-mcp = "tasmac_mcp.server:main"
tasmac-mcp-http = "tasmac_mcp.server:main_http"

[tool.setuptools]
packages = ["tasmac_mcp"]

# The survey ships with the package: a tier computed from real inventory is
# useless if it only exists in the checkout.
[tool.setuptools.package-data]
tasmac_mcp = ["data/*.json"]
